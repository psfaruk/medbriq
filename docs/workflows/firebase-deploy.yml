# ─────────────────────────────────────────────────────────────────────────────
# Deploys ONLY the Firebase security rules and Firestore indexes.
# The app itself is deployed by Vercel's Git integration — never from here.
#
# INSTALL (the GitHub integration token used here cannot write to .github/):
#   Via web UI: Add file → Create new file → name it
#   .github/workflows/firebase-deploy.yml → paste this file's content → Commit.
#
# The credential is the service-account JSON pasted AS-IS (no base64 needed)
# into the repository secret FIREBASE_SERVICE_ACCOUNT — the same secret the
# CI production preflight uses. Use a FRESH key (rotate the exposed one first).
#
# Never paste a private key into a chat, an issue or a commit.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Firebase rules & indexes

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: firebase deploy (rules + indexes)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-tools
        run: npm install --global firebase-tools

      - name: Materialize service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          # Never echo the key material back into the log.
          echo "service account materialized ($(wc -c < "$RUNNER_TEMP/sa.json") bytes)"

      - name: Deploy rules & indexes
        run: |
          firebase deploy \
            --project medifindbd \
            --only firestore:rules,firestore:indexes,storage \
            --non-interactive

      - name: Shred credential
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
