# ─────────────────────────────────────────────────────────────────────────────
# Dependency updates. The app handles phone numbers, OTP codes and
# medical-adjacent records, so known-vulnerable transitive packages must not
# linger. Grouped by ecosystem to keep the PR count sane.
#
# INSTALL (the GitHub integration token used here cannot write to .github/):
#   mkdir -p .github
#   cp docs/workflows/dependabot.yml .github/dependabot.yml
#
# FIX (audit 2026-11-27): the previous revision never parsed — the update
# entries sat at the top level next to `version: 2` (invalid YAML) and
# `update-timeout: 15` is not a Dependabot key, so GitHub reported a
# configuration error and dependency update PRs were never created.
#
# NOTE (verified empirically after the fix): the npm entry cannot create
# version-update PRs while the repo is bun-only (bun.lock) — Dependabot's
# npm ecosystem needs package-lock.json / yarn.lock. The entry is kept so
# updates start automatically if Dependabot gains bun.lock support, and
# because Dependabot ALERTS (security advisories) work off package.json
# regardless. Expect the weekly npm_and_yarn internal update run to fail
# until then; github-actions updates work today.
# ─────────────────────────────────────────────────────────────────────────────

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    groups:
      production-deps:
        applies-to: version-updates
        dependency-type: production
      dev-deps:
        applies-to: version-updates
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
