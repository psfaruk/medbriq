# ─────────────────────────────────────────────────────────────────────────────
# Dependency updates. The app handles phone numbers, OTP codes and
# medical-adjacent records, so known-vulnerable transitive packages must not
# linger. Grouped by ecosystem to keep the PR count sane.
#
# INSTALL (the GitHub integration token used here cannot write to .github/):
#   mkdir -p .github
#   cp docs/workflows/dependabot.yml .github/dependabot.yml
# ─────────────────────────────────────────────────────────────────────────────

version: 2
update-timeout: 15

- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Asia/Dhaka
  groups:
    production-deps:
      applies-to: version-updates
      dependency-type: production
    dev-deps:
      applies-to: version-updates
      dependency-type: development
  open-pull-requests-limit: 5

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Asia/Dhaka
  open-pull-requests-limit: 3
